apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: flask-project
  namespace: argocd
spec:
  description: project for flask application

  sourceRepos:
  - "*"

  destinations:
  - namespace: flask
    server: https://kubernetes.default.svc
  
  clusterResourceWhitelist:
  - group: "*"
    kind: "*"
