apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app
  namespace: argocd
spec:
  project: flask-project

  source:
    repoURL: https://github.com/Saurabh-dev-create/ArgoCD_App_of_Apps.git
    targetRevision: HEAD
    path: flask

  destination:
    server: https://kubernetes.default.svc
    namespace: flask

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
